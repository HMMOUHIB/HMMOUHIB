<title>My Contributions</title>
<defs><style>
  .bob { transform-box: fill-box; transform-origin: center; animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-4px) rotate(1.5deg); } }
  .flick { animation: flick 2.4s steps(2) infinite; }
  @keyframes flick { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .slide { animation: slide 6s linear infinite; }
  @keyframes slide { to { transform: translateX(-40px); } }
  @media (prefers-reduced-motion: reduce) { .bob, .flick, .spin, .slide { animation: none; } }
</style></defs>
